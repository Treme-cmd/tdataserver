<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings</title>
  <style>body { visibility: hidden; }</style>
  <link id="theme-stylesheet" rel="stylesheet" href="/style.css" onload="document.body.style.visibility='visible'">
  <script src="/settings.js"></script>
</head>
<body>
  <div class="container">
    <h1>Settings</h1>
    <p>Choose your preferred theme.</p>
    <div class="theme-options">
      <div class="theme-card" onclick="setTheme('/style.css')" id="card-1">
        <div class="theme-preview preview-1">
          <span>Aa</span>
        </div>
        <p>Classic</p>
      </div>
      <div class="theme-card" onclick="setTheme('/style2.css')" id="card-2">
        <div class="theme-preview preview-2">
          <span>Aa</span>
        </div>
        <p>New</p>
      </div>
    </div>
    <div class="setting-row">
      <p>Confirm before leaving page</p>
      <label class="switch">
        <input type="checkbox" id="exitToggle" onchange="toggleExitConfirm(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <button class="blanker" onclick="blanker()">about:blanker</button>
    </div>
    <a href="/" class="button" style="margin-top: 2rem;">Go back home</a>
  </div>
  <style>
    .theme-options {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
      margin: 2rem 0;
    }
    .theme-card {
      cursor: pointer;
      border: 3px solid transparent;
      border-radius: 10px;
      padding: 12px;
      transition: border-color 0.2s, transform 0.2s;
      text-align: center;
    }
    .theme-card:hover { transform: translateY(-4px); }
    .theme-card.active { border-color: #61dafb; }
    .theme-preview {
      width: 120px;
      height: 80px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .preview-1 {
      background: linear-gradient(135deg, #282c34, #3a3f47);
      color: #61dafb;
      font-family: 'Roboto', sans-serif;
    }
    .preview-2 {
      background: #0f0e11;
      color: #f2c94c;
      font-family: 'Fira Code', monospace;
      border: 2px solid #3d3a44;
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 1.5rem 0;
      font-size: 1rem;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 28px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 28px;
      cursor: pointer;
      transition: 0.3s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      left: 4px;
      bottom: 4px;
      background: white;
      border-radius: 50%;
      transition: 0.3s;
    }
    .switch input:checked + .slider { background: #61dafb; }
    .switch input:checked + .slider::before { transform: translateX(24px); }
  </style>

  <script>
    function setTheme(filename) {
      localStorage.setItem('theme', filename);
      document.getElementById('theme-stylesheet').href = filename;
      highlightActive(filename);
    }

    function highlightActive(filename) {
      document.getElementById('card-1').classList.toggle('active', filename === '/style.css');
      document.getElementById('card-2').classList.toggle('active', filename === '/style2.css');
    }

    const current = localStorage.getItem('theme') || '/style.css';
    highlightActive(current);

    const exitToggle = document.getElementById('exitToggle');
    exitToggle.checked = localStorage.getItem('confirmExit') === 'true';

    function toggleExitConfirm(enabled) {
      localStorage.setItem('confirmExit', enabled);
    }
    function blanker() {
      var win = window.open();
      var url = "./";
      var doc = win.document;
      doc.body.style.margin = "0";
      doc.body.style.padding = "0";
      doc.body.style.height = "100%";
      doc.documentElement.style.height = "100%";
      doc.documentElement.style.overflow = "hidden";
      var iframe = doc.createElement('iframe');
      iframe.style.width = "100%";
      iframe.style.height = "100%";
      iframe.style.border = "none";
      iframe.style.display = "block";
      iframe.src = url;
      doc.body.appendChild(iframe);
    }
  </script>
</body>
</html>
